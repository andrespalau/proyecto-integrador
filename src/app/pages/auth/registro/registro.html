<section class="registro-page">

  <div class="container">
    <div class="row justify-content-center">

      <div class="col-12 col-md-9 col-lg-6">

        <div class="card registro-card border-0 shadow">

          <div class="card-body p-4 p-md-5">

            <div class="text-center mb-4">

              <div class="registro-icon">
                👤
              </div>

              <h1 class="fw-bold">
                Crear cuenta
              </h1>

              <p class="text-muted">
                Regístrate para acceder a la plataforma de eventos
              </p>

            </div>

            <form>

              <div class="mb-3">
                <label
                  for="nombre"
                  class="form-label fw-semibold">
                  Nombre completo
                </label>

                <input
                  type="text"
                  id="nombre"
                  class="form-control form-control-lg"
                  placeholder="Ingresa tu nombre completo">
              </div>

              <div class="mb-3">
                <label
                  for="correo"
                  class="form-label fw-semibold">
                  Correo electrónico
                </label>

                <input
                  type="email"
                  id="correo"
                  class="form-control form-control-lg"
                  placeholder="correo@ejemplo.com">
              </div>

              <div class="mb-3">
                <label
                  for="telefono"
                  class="form-label fw-semibold">
                  Teléfono
                </label>

                <input
                  type="tel"
                  id="telefono"
                  class="form-control form-control-lg"
                  placeholder="300 000 0000">
              </div>

              <div class="mb-3">
                <label
                  for="password"
                  class="form-label fw-semibold">
                  Contraseña
                </label>

                <input
                  type="password"
                  id="password"
                  class="form-control form-control-lg"
                  placeholder="Crea una contraseña">
              </div>

              <div class="mb-4">
                <label
                  for="confirmar"
                  class="form-label fw-semibold">
                  Confirmar contraseña
                </label>

                <input
                  type="password"
                  id="confirmar"
                  class="form-control form-control-lg"
                  placeholder="Confirma tu contraseña">
              </div>

              <button
                type="button"
                class="btn btn-primary btn-lg w-100">
                Registrarme
              </button>

            </form>

            <hr class="my-4">

            <div class="text-center">

              <p class="mb-2">
                ¿Ya tienes una cuenta?
              </p>

              <a
                routerLink="/login"
                class="btn btn-outline-primary">
                Iniciar sesión
              </a>

            </div>

          </div>

        </div>

      </div>

    </div>
  </div>

</section>
