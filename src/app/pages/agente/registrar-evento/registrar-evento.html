<section class="registro-evento-page">

  <div class="container py-5">

    <div class="text-center mb-5">

      <h1 class="fw-bold">
        Registrar evento
      </h1>

      <p class="text-muted">
        Completa la información necesaria para registrar un nuevo evento.
      </p>

    </div>

    <div class="row justify-content-center">

      <div class="col-12 col-lg-9">

        <div class="card border-0 shadow registro-evento-card">

          <div class="card-body p-4 p-md-5">

            <form>

              <div class="mb-4">

                <label
                  for="nombre"
                  class="form-label fw-semibold">
                  Nombre del evento
                </label>

                <input
                  type="text"
                  id="nombre"
                  class="form-control form-control-lg"
                  placeholder="Ej. Festival de Música">

              </div>

              <div class="mb-4">

                <label
                  for="descripcion"
                  class="form-label fw-semibold">
                  Descripción
                </label>

                <textarea
                  id="descripcion"
                  class="form-control"
                  rows="4"
                  placeholder="Describe el evento">
                </textarea>

              </div>

              <div class="row">

                <div class="col-md-6 mb-4">

                  <label
                    for="fecha"
                    class="form-label fw-semibold">
                    Fecha
                  </label>

                  <input
                    type="date"
                    id="fecha"
                    class="form-control form-control-lg">

                </div>

                <div class="col-md-6 mb-4">

                  <label
                    for="hora"
                    class="form-label fw-semibold">
                    Hora
                  </label>

                  <input
                    type="time"
                    id="hora"
                    class="form-control form-control-lg">

                </div>

              </div>

              <div class="mb-4">

                <label
                  for="lugar"
                  class="form-label fw-semibold">
                  Lugar
                </label>

                <input
                  type="text"
                  id="lugar"
                  class="form-control form-control-lg"
                  placeholder="Lugar del evento">

              </div>

              <div class="row">

                <div class="col-md-6 mb-4">

                  <label
                    for="capacidad"
                    class="form-label fw-semibold">
                    Capacidad
                  </label>

                  <input
                    type="number"
                    id="capacidad"
                    min="1"
                    class="form-control form-control-lg"
                    placeholder="100">

                </div>

                <div class="col-md-6 mb-4">

                  <label
                    for="categoria"
                    class="form-label fw-semibold">
                    Categoría
                  </label>

                  <select
                    id="categoria"
                    class="form-select form-select-lg">

                    <option value="">
                      Selecciona una categoría
                    </option>

                    <option>
                      Música
                    </option>

                    <option>
                      Tecnología
                    </option>

                    <option>
                      Deportes
                    </option>

                    <option>
                      Cultura
                    </option>

                    <option>
                      Educación
                    </option>

                  </select>

                </div>

              </div>

              <div class="alert alert-info">
                <strong>Nota:</strong>
                En esta etapa el registro del evento es una simulación.
                Los datos todavía no se almacenan de forma permanente.
              </div>

              <button
                type="button"
                class="btn btn-primary btn-lg w-100">

                Registrar evento

              </button>

            </form>

          </div>

        </div>

      </div>

    </div>

  </div>

</section>
