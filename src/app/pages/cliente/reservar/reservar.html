<section class="reserva-page">

  <div class="container py-5">

    <div class="text-center mb-5">

      <h1 class="fw-bold">
        Realizar reserva
      </h1>

      <p class="text-muted">
        Selecciona un evento y completa la información de tu reserva.
      </p>

    </div>

    <div class="row justify-content-center">

      <div class="col-12 col-lg-8">

        <div class="card border-0 shadow reserva-card">

          <div class="card-body p-4 p-md-5">

            <form>

              <div class="mb-4">

                <label
                  for="evento"
                  class="form-label fw-semibold">
                  Evento
                </label>

                <select
                  id="evento"
                  class="form-select form-select-lg">

                  <option value="">
                    Selecciona un evento
                  </option>

                  @for (evento of eventos; track evento.id) {

                    <option [value]="evento.id">
                      {{ evento.nombre }} -
                      {{ evento.fecha }} -
                      {{ evento.lugar }}
                    </option>

                  }

                </select>

              </div>

              <div class="row">

                <div class="col-md-6 mb-4">

                  <label
                    for="nombre"
                    class="form-label fw-semibold">
                    Nombre del cliente
                  </label>

                  <input
                    type="text"
                    id="nombre"
                    class="form-control form-control-lg"
                    placeholder="Nombre completo">

                </div>

                <div class="col-md-6 mb-4">

                  <label
                    for="cantidad"
                    class="form-label fw-semibold">
                    Cantidad de entradas
                  </label>

                  <input
                    type="number"
                    id="cantidad"
                    min="1"
                    class="form-control form-control-lg"
                    placeholder="1">

                </div>

              </div>

              <div class="mb-4">

                <label
                  for="correo"
                  class="form-label fw-semibold">
                  Correo electrónico
                </label>

                <input
                  type="email"
                  id="correo"
                  class="form-control form-control-lg"
                  placeholder="correo@ejemplo.com">

              </div>

              <div class="mb-4">

                <label
                  for="observaciones"
                  class="form-label fw-semibold">
                  Observaciones
                </label>

                <textarea
                  id="observaciones"
                  rows="4"
                  class="form-control"
                  placeholder="Información adicional de la reserva">
                </textarea>

              </div>

              <div class="alert alert-info">

                <strong>Nota:</strong>
                En esta etapa la reserva es una simulación visual.
                La información no se almacenará de forma permanente.

              </div>

              <button
                type="button"
                class="btn btn-primary btn-lg w-100">

                Confirmar reserva

              </button>

            </form>

          </div>

        </div>

      </div>

    </div>

  </div>

</section>
